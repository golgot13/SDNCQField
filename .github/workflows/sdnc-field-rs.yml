name: SDNCQField-RS (PC Windows / Linux / Android APK)

on:
  push:
    branches: [master, main, "feat/**"]
    paths:
      - "sdnc-field-rs/**"
      - ".github/workflows/sdnc-field-rs.yml"
  pull_request:
    paths:
      - "sdnc-field-rs/**"
      - ".github/workflows/sdnc-field-rs.yml"
  workflow_dispatch:

jobs:
  pc-linux:
    name: PC Linux x86_64 (Build, Tests & Package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdnc-field-rs
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI & Vulkan system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdnc-field-rs -> target
      - name: Run workspace unit tests
        run: cargo test --workspace
      - name: Build release binary (Linux Vulkan)
        run: cargo build --release -p sdnc-app-desktop
      - name: Package Linux archive
        run: |
          mkdir -p dist-linux
          cp target/release/sdnc-field README.md dist-linux/
          tar -czf SDNCQField-RS-Linux-x86_64.tar.gz -C dist-linux .
      - uses: actions/upload-artifact@v4
        with:
          name: SDNCQField-RS-PC-Linux-x86_64
          path: sdnc-field-rs/SDNCQField-RS-Linux-x86_64.tar.gz

  pc-windows:
    name: PC Windows x86_64 (Build, Tests & Package)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sdnc-field-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdnc-field-rs -> target
      - name: Run workspace unit tests
        run: cargo test --workspace
      - name: Build release executable (Windows Vulkan/DX12)
        run: cargo build --release -p sdnc-app-desktop
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Copy-Item target/release/sdnc-field.exe dist-windows/SDNCQField-RS.exe
          Copy-Item README.md dist-windows/README.md
          Compress-Archive -Path dist-windows/* -DestinationPath SDNCQField-RS-Windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SDNCQField-RS-PC-Windows-x86_64
          path: sdnc-field-rs/SDNCQField-RS-Windows-x86_64.zip

  android-apk:
    name: Android Tablettes & Téléphones (arm64-v8a + armeabi-v7a APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdnc-field-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdnc-field-rs -> target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          validate-wrappers: false
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Compile Rust Vulkan native libs (arm64-v8a & armeabi-v7a)
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -o android/app/src/main/jniLibs build --release -p sdnc-app-android
      - name: Assemble installable Android APK (Tablets & Smartphones)
        working-directory: sdnc-field-rs/android
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../SDNCQField-RS-Android-arm64-armv7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SDNCQField-RS-Android-Tablettes-Telephones-APK
          path: sdnc-field-rs/SDNCQField-RS-Android-arm64-armv7.apk
