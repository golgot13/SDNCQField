[package]
name = "sdnc-app-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sdnc_field_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
sdnc-gnss = { path = "../sdnc-gnss" }

[target.'cfg(target_os = "android")'.dependencies]
sdnc-ui = { path = "../sdnc-ui" }
eframe = { workspace = true, features = ["android-game-activity"] }
egui.workspace = true
log.workspace = true
android_logger = "0.14"
winit = { version = "0.30", features = ["android-game-activity"] }
jni = "0.21"
